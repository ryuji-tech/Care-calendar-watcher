name: watch

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分間隔(GitHub側の混雑で数分遅れることあり)
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知を送る (true/false)"
        default: "true"
        required: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run watcher
        env:
          TARGET_URL_TEMPLATE: ${{ secrets.TARGET_URL_TEMPLATE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLICK_URL: ${{ secrets.CLICK_URL }}
          SEND_TEST: ${{ github.event.inputs.test || 'false' }}
        run: python3 watcher.py

      - name: Commit state (keep-alive)
        run: |
          git config user.name "watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
